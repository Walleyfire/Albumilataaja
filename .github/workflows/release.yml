name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and test application and installer
        shell: pwsh
        run: ./lahdekoodi/build.ps1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Albumilataaja-Windows
          path: |
            dist/Albumilataaja-Setup.exe
            dist/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path lahdekoodi/app.py -Pattern "^VERSION = '([0-9.]+)'").Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application versions differ' }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "Albumilataaja $version" --generate-notes --draft
            if ($LASTEXITCODE) { throw 'Release creation failed' }
          }
          gh release upload $env:GITHUB_REF_NAME dist/Albumilataaja-Setup.exe dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE) { throw 'Release publishing failed' }
